name: CI

on:
  push:
    branches: [main, "phase*/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore and build
        shell: pwsh
        run: |
          function Invoke-Reported([string]$name, [string[]]$arguments) {
            $output = & dotnet @arguments 2>&1 | ForEach-Object { "$_" }
            $output | Write-Output
            if ($LASTEXITCODE -ne 0) {
              # Error lines (or the tail) become annotations, readable without the raw log.
              $errors = $output | Where-Object { $_ -match '(error|Error|ERROR)' } | Select-Object -Unique -First 40
              if (-not $errors) { $errors = $output | Select-Object -Last 25 }
              foreach ($line in $errors) { Write-Output ("::error title=$name::" + ($line -replace '%', '%25')) }
              exit $LASTEXITCODE
            }
          }
          Invoke-Reported "restore" @("restore", "WinTool.sln")
          Invoke-Reported "build" @("build", "WinTool.sln", "-c", "${{ matrix.configuration }}", "--no-restore", "-v", "minimal")

      - name: Unit tests
        shell: pwsh
        run: |
          $output = & dotnet test WinTool.sln -c ${{ matrix.configuration }} --no-build --logger trx --logger "console;verbosity=normal" --results-directory TestResults 2>&1 | ForEach-Object { "$_" }
          $output | Write-Output
          if ($LASTEXITCODE -ne 0) {
            $lines = $output | Where-Object { $_ -match 'Failed |Error Message|Assert|Exception|error' } | Select-Object -Unique -First 40
            if (-not $lines) { $lines = $output | Select-Object -Last 25 }
            foreach ($line in $lines) { Write-Output ("::error title=tests::" + ($line -replace '%', '%25')) }
            exit $LASTEXITCODE
          }

      - name: Portable EXE self-test (WinTool-by-PcNinja.exe alone in an empty folder)
        shell: pwsh
        run: |
          $source = "src/WinTool.App/bin/${{ matrix.configuration }}/net48/WinTool-by-PcNinja.exe"
          if (-not (Test-Path $source)) { Write-Output "::warning title=self-test::$source not found, searching" }
          if (-not (Test-Path $source)) { $source = Get-ChildItem -Recurse -Filter WinTool-by-PcNinja.exe src/WinTool.App/bin | Where-Object FullName -like "*${{ matrix.configuration }}*" | Select-Object -First 1 -ExpandProperty FullName }
          $portable = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item $source $portable
          if ((Split-Path $source -Leaf) -ne "WinTool-by-PcNinja.exe") { Write-Output "::error title=naming::Official file name must be WinTool-by-PcNinja.exe"; exit 1 }
          Get-ChildItem $portable | Format-Table Name, Length
          $exe = Join-Path $portable "WinTool-by-PcNinja.exe"
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          Get-Content $out
          if ($p.ExitCode -ne 0) { Get-Content $out | ForEach-Object { Write-Output "::error title=self-test::$_" }; throw "Self-test failed with exit code $($p.ExitCode)" }
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          Get-Content $out
          if ($p.ExitCode -ne 0) { Write-Output "::error title=self-test::--version exit $($p.ExitCode)"; throw "--version failed with exit code $($p.ExitCode)" }
          $p = Start-Process -FilePath $exe -ArgumentList "no-such-command" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError "$out.err"
          if ($p.ExitCode -ne 2) { Write-Output "::error title=self-test::unknown command exit $($p.ExitCode)"; throw "Unknown command should exit with 2, got $($p.ExitCode)" }

      - name: UI smoke test (every page, theme and language)
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "portable\WinTool-by-PcNinja.exe"
          $out = Join-Path $env:RUNNER_TEMP "ui-smoke.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--ui-smoke" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          $lines = Get-Content $out
          $lines | Where-Object { $_ -notmatch '^  OK ' } | ForEach-Object { Write-Host $_ }
          Write-Host ("Pages checked: " + ($lines | Where-Object { $_ -match '^  OK ' }).Count)
          if ($p.ExitCode -ne 0) {
            $lines | Where-Object { $_ -match 'FAIL' } | Select-Object -First 30 | ForEach-Object { Write-Host ("::error title=ui::" + ($_ -replace '%', '%25')) }
            exit 1
          }

      - name: Windows integration smoke test (real Task Scheduler, services, COM)
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "portable\WinTool-by-PcNinja.exe"
          function Invoke-WinTool([string[]]$arguments, [int[]]$allowed) {
            $out = Join-Path $env:RUNNER_TEMP "cli-out.txt"
            $err = Join-Path $env:RUNNER_TEMP "cli-err.txt"
            $p = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
            $text = (Get-Content $out -Raw) + (Get-Content $err -Raw)
            Write-Host "> $($arguments -join ' ')  (exit $($p.ExitCode))"
            Write-Host $text
            if ($allowed -notcontains $p.ExitCode) {
              Write-Host "::error title=cli::'$($arguments -join ' ')' exited with $($p.ExitCode)"
              exit 1
            }
            return $text
          }
          Invoke-WinTool @('status', '--json') @(0) | Out-Null
          Invoke-WinTool @('schedule', 'set', '--enable', '--frequency', 'Weekly', '--day', 'Sunday', '--time', '03:00', '--wake') @(0) | Out-Null
          $show = Invoke-WinTool @('schedule', 'show', '--json') @(0)
          if ($show -notmatch '"matchesSettings": true') {
            Invoke-WinTool @('schedule', 'show') @(0) | Out-Null
            Write-Host "::error title=cli::registered task does not match the settings"
            exit 1
          }
          # Monthly too: Task Scheduler stores its elements in another order (found on Windows 11 23H2).
          Invoke-WinTool @('schedule', 'set', '--frequency', 'Monthly', '--month-day', '15', '--at-startup') @(0) | Out-Null
          $monthly = Invoke-WinTool @('schedule', 'show', '--json') @(0)
          if ($monthly -notmatch '"matchesSettings": true') {
            Invoke-WinTool @('schedule', 'show') @(0) | Out-Null
            Write-Host "::error title=cli::monthly task does not match the settings"
            exit 1
          }
          Invoke-WinTool @('update', 'health', '--no-network') @(0, 1, 11) | Out-Null
          Invoke-WinTool @('schedule', 'remove') @(0) | Out-Null
          $after = Invoke-WinTool @('schedule', 'show', '--json') @(0)
          if ($after -notmatch '"task": null') { Write-Output "::error title=cli::task still present after remove"; exit 1 }
          Invoke-WinTool @('logs', 'collect', '--output', (Join-Path $env:RUNNER_TEMP 'logs.zip')) @(0) | Out-Null
          # A real Windows Update search. Build machines may have the service restricted, so a failure is reported, not fatal.
          $scan = Start-Process -FilePath $exe -ArgumentList @('update', 'scan', '--json') -Wait -PassThru -NoNewWindow -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'scan.json')
          Get-Content (Join-Path $env:RUNNER_TEMP 'scan.json')
          if ($scan.ExitCode -ne 0) { Write-Output "::warning title=scan::update scan exited with $($scan.ExitCode) on the build machine" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.configuration }}
          path: TestResults

      - name: Upload portable EXE
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: WinTool-by-PcNinja-portable-unsigned
          path: src/WinTool.App/bin/Release/net48/WinTool-by-PcNinja.exe
          if-no-files-found: error
