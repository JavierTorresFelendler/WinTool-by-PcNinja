name: CI

on:
  push:
    branches: [main, "phase*/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WinTool.sln

      - name: Build
        shell: pwsh
        run: |
          dotnet build WinTool.sln -c ${{ matrix.configuration }} --no-restore "-flp:logfile=build.log;verbosity=minimal"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Surface each compiler/XAML error as an annotation so it is readable without the raw log.
            Get-Content build.log | Select-String -Pattern ': error ' | Select-Object -First 40 | ForEach-Object {
              $line = $_.Line -replace '%', '%25' -replace "`r", '' -replace "`n", ' '
              Write-Output "::error::$line"
            }
            exit $code
          }

      - name: Unit tests
        run: dotnet test tests/WinTool.Core.Tests/WinTool.Core.Tests.csproj -c ${{ matrix.configuration }} --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Portable EXE self-test (WinTool.exe alone in an empty folder)
        shell: pwsh
        run: |
          $source = "src/WinTool.App/bin/x64/${{ matrix.configuration }}/net48/WinTool.exe"
          if (-not (Test-Path $source)) { $source = Get-ChildItem -Recurse -Filter WinTool.exe src/WinTool.App/bin | Where-Object FullName -like "*${{ matrix.configuration }}*" | Select-Object -First 1 -ExpandProperty FullName }
          $portable = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item $source $portable
          Get-ChildItem $portable | Format-Table Name, Length
          $exe = Join-Path $portable "WinTool.exe"
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "--version failed with exit code $($p.ExitCode)" }
          $p = Start-Process -FilePath $exe -ArgumentList "no-such-command" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError "$out.err"
          if ($p.ExitCode -ne 2) { throw "Unknown command should exit with 2, got $($p.ExitCode)" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.configuration }}
          path: TestResults

      - name: Upload portable EXE
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v5
        with:
          name: WinTool-portable-unsigned
          path: src/WinTool.App/bin/**/Release/net48/WinTool.exe
          if-no-files-found: error
