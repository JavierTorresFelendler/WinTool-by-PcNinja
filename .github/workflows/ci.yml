name: CI

on:
  push:
    branches: [main, "phase*/**"]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this whole pipeline on a tag, stamped with the release version.
  workflow_call:
    inputs:
      tag:
        description: Release tag such as v1.0.0 or v1.0.0-rc.1 (empty for a normal CI build)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Release version (D-024)
        if: inputs.tag != ''
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)\.(\d+))?$') {
            Write-Host "::error title=version::Tag '$tag' is not v<major>.<minor>.<patch> or v<...>-alpha|beta|rc.<n>"
            exit 1
          }
          $version = $tag.Substring(1)
          $code = if ($Matches[4]) { @{ alpha = 1000; beta = 2000; rc = 3000 }[$Matches[4]] + [int]$Matches[5] } else { 9000 }
          $file = "$($Matches[1]).$($Matches[2]).$($Matches[3]).$code"
          $assembly = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          "WINTOOL_VERSION=$version" | Out-File -Append $env:GITHUB_ENV
          "WINTOOL_FILE_VERSION=$file" | Out-File -Append $env:GITHUB_ENV
          "WINTOOL_VERSION_ARGS=-p:Version=$version -p:FileVersion=$file -p:AssemblyVersion=$assembly" | Out-File -Append $env:GITHUB_ENV
          Write-Host "Release $version, file version $file"

      - name: Restore and build
        shell: pwsh
        run: |
          function Invoke-Reported([string]$name, [string[]]$arguments) {
            $output = & dotnet @arguments 2>&1 | ForEach-Object { "$_" }
            $output | Write-Output
            if ($LASTEXITCODE -ne 0) {
              # Error lines (or the tail) become annotations, readable without the raw log.
              $errors = $output | Where-Object { $_ -match '(error|Error|ERROR)' } | Select-Object -Unique -First 40
              if (-not $errors) { $errors = $output | Select-Object -Last 25 }
              foreach ($line in $errors) { Write-Output ("::error title=$name::" + ($line -replace '%', '%25')) }
              exit $LASTEXITCODE
            }
          }
          Invoke-Reported "restore" @("restore", "WinTool.sln")
          $build = @("build", "WinTool.sln", "-c", "${{ matrix.configuration }}", "--no-restore", "-v", "minimal")
          if ($env:WINTOOL_VERSION_ARGS) { $build += $env:WINTOOL_VERSION_ARGS.Split(' ') }
          Invoke-Reported "build" $build
          if ($env:WINTOOL_VERSION) {
            # The EXE's own version rules (AppVersion) must agree with the stamped file.
            $exe = "src/WinTool.App/bin/${{ matrix.configuration }}/net48/WinTool-by-PcNinja.exe"
            $info = (Get-Item $exe).VersionInfo
            if ($info.FileVersion -ne $env:WINTOOL_FILE_VERSION) { Write-Host "::error title=version::EXE file version $($info.FileVersion), expected $env:WINTOOL_FILE_VERSION"; exit 1 }
          }

      - name: Unit tests
        shell: pwsh
        run: |
          $output = & dotnet test WinTool.sln -c ${{ matrix.configuration }} --no-build --logger trx --logger "console;verbosity=normal" --results-directory TestResults 2>&1 | ForEach-Object { "$_" }
          $output | Write-Output
          if ($LASTEXITCODE -ne 0) {
            $lines = $output | Where-Object { $_ -match 'Failed |Error Message|Assert|Exception|error' } | Select-Object -Unique -First 40
            if (-not $lines) { $lines = $output | Select-Object -Last 25 }
            foreach ($line in $lines) { Write-Output ("::error title=tests::" + ($line -replace '%', '%25')) }
            exit $LASTEXITCODE
          }

      - name: Portable EXE self-test (WinTool-by-PcNinja.exe alone in an empty folder)
        shell: pwsh
        run: |
          $source = "src/WinTool.App/bin/${{ matrix.configuration }}/net48/WinTool-by-PcNinja.exe"
          if (-not (Test-Path $source)) { Write-Output "::warning title=self-test::$source not found, searching" }
          if (-not (Test-Path $source)) { $source = Get-ChildItem -Recurse -Filter WinTool-by-PcNinja.exe src/WinTool.App/bin | Where-Object FullName -like "*${{ matrix.configuration }}*" | Select-Object -First 1 -ExpandProperty FullName }
          $portable = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item $source $portable
          if ((Split-Path $source -Leaf) -ne "WinTool-by-PcNinja.exe") { Write-Output "::error title=naming::Official file name must be WinTool-by-PcNinja.exe"; exit 1 }
          Get-ChildItem $portable | Format-Table Name, Length
          $exe = Join-Path $portable "WinTool-by-PcNinja.exe"
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          Get-Content $out
          if ($p.ExitCode -ne 0) { Get-Content $out | ForEach-Object { Write-Output "::error title=self-test::$_" }; throw "Self-test failed with exit code $($p.ExitCode)" }
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          Get-Content $out
          if ($p.ExitCode -ne 0) { Write-Output "::error title=self-test::--version exit $($p.ExitCode)"; throw "--version failed with exit code $($p.ExitCode)" }
          $p = Start-Process -FilePath $exe -ArgumentList "no-such-command" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError "$out.err"
          if ($p.ExitCode -ne 2) { Write-Output "::error title=self-test::unknown command exit $($p.ExitCode)"; throw "Unknown command should exit with 2, got $($p.ExitCode)" }

      - name: UI smoke test (every page, theme and language)
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "portable\WinTool-by-PcNinja.exe"
          $out = Join-Path $env:RUNNER_TEMP "ui-smoke.txt"
          # Release builds also save screenshots of every page for review (artifact ui-screenshots).
          if ("${{ matrix.configuration }}" -eq "Release") { $env:WINTOOL_SMOKE_SCREENSHOTS = Join-Path $env:RUNNER_TEMP "ui-screenshots" }
          $p = Start-Process -FilePath $exe -ArgumentList "--ui-smoke" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          $lines = Get-Content $out
          $lines | Where-Object { $_ -notmatch '^  OK ' } | ForEach-Object { Write-Host $_ }
          Write-Host ("Pages checked: " + ($lines | Where-Object { $_ -match '^  OK ' }).Count)
          if ($p.ExitCode -ne 0) {
            $lines | Where-Object { $_ -match 'FAIL' } | Select-Object -First 30 | ForEach-Object { Write-Host ("::error title=ui::" + ($_ -replace '%', '%25')) }
            exit 1
          }

      - name: Windows integration smoke test (real Task Scheduler, services, COM)
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "portable\WinTool-by-PcNinja.exe"
          function Invoke-WinTool([string[]]$arguments, [int[]]$allowed) {
            $out = Join-Path $env:RUNNER_TEMP "cli-out.txt"
            $err = Join-Path $env:RUNNER_TEMP "cli-err.txt"
            $p = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
            $text = (Get-Content $out -Raw) + (Get-Content $err -Raw)
            Write-Host "> $($arguments -join ' ')  (exit $($p.ExitCode))"
            Write-Host $text
            if ($allowed -notcontains $p.ExitCode) {
              Write-Host "::error title=cli::'$($arguments -join ' ')' exited with $($p.ExitCode)"
              exit 1
            }
            return $text
          }
          Invoke-WinTool @('status', '--json') @(0) | Out-Null
          Invoke-WinTool @('schedule', 'set', '--enable', '--frequency', 'Weekly', '--day', 'Sunday', '--time', '03:00', '--wake') @(0) | Out-Null
          $show = Invoke-WinTool @('schedule', 'show', '--json') @(0)
          if ($show -notmatch '"matchesSettings": true') {
            Invoke-WinTool @('schedule', 'show') @(0) | Out-Null
            Write-Host "::error title=cli::registered task does not match the settings"
            exit 1
          }
          # Monthly too: Task Scheduler stores its elements in another order (found on Windows 11 23H2).
          Invoke-WinTool @('schedule', 'set', '--frequency', 'Monthly', '--month-day', '15', '--at-startup') @(0) | Out-Null
          $monthly = Invoke-WinTool @('schedule', 'show', '--json') @(0)
          if ($monthly -notmatch '"matchesSettings": true') {
            Invoke-WinTool @('schedule', 'show') @(0) | Out-Null
            Write-Host "::error title=cli::monthly task does not match the settings"
            exit 1
          }
          Invoke-WinTool @('update', 'health', '--no-network') @(0, 1, 11) | Out-Null
          Invoke-WinTool @('schedule', 'remove') @(0) | Out-Null
          $after = Invoke-WinTool @('schedule', 'show', '--json') @(0)
          if ($after -notmatch '"task": null') { Write-Output "::error title=cli::task still present after remove"; exit 1 }
          Invoke-WinTool @('logs', 'collect', '--output', (Join-Path $env:RUNNER_TEMP 'logs.zip')) @(0) | Out-Null
          # Office: read-only commands and refusals only. Nothing is installed or removed here.
          Invoke-WinTool @('office', 'status', '--json') @(0) | Out-Null
          $config = Invoke-WinTool @('office', 'config', '--family', 'ltsc', '--languages', 'he-il,en-us', '--visio') @(0)
          if ($config -notmatch 'ProPlus2024Volume' -or $config -notmatch 'VisioPro2024Volume') {
            Write-Host "::error title=cli::office config did not produce the LTSC configuration"
            exit 1
          }
          Invoke-WinTool @('office', 'remove') @(2) | Out-Null
          # The real Office Deployment Tool: found on Microsoft's page, downloaded, Microsoft-signed. Runs nothing.
          $tool = Invoke-WinTool @('office', 'tool-check', '--json') @(0, 11)
          if ($tool -match '"latest": false') { Write-Host "::warning title=office::Microsoft's page gave no ODT link; the fixed address was used" }
          # Windows Upgrade: read-only commands and refusals only. Never --yes here: Setup must not run on a build machine.
          $upgrade = Invoke-WinTool @('upgrade', 'status', '--json') @(0)
          if ($upgrade -notmatch '"resultCode": "STATUS_REPORTED"' -or $upgrade -notmatch '"readyForRestart": false') {
            Write-Host "::error title=cli::upgrade status --json broke the result contract"
            exit 1
          }
          Invoke-WinTool @('upgrade', 'scan', '--json') @(0) | Out-Null
          Invoke-WinTool @('upgrade', 'downloads', '--json') @(0, 31) | Out-Null
          Invoke-WinTool @('upgrade', 'run', '--mounted', 'C:\NoSuchMedia') @(2) | Out-Null
          # The build machine is Windows Server: validation must be refused (30), never attempted.
          Invoke-WinTool @('upgrade', 'validate', '--mounted', 'C:\NoSuchMedia', '--json') @(30) | Out-Null
          Invoke-WinTool @('upgrade', 'run', '--mounted', 'C:\NoSuchMedia', '--dry-run', '--json') @(30) | Out-Null
          # A real Windows Update search. Build machines may have the service restricted, so a failure is reported, not fatal.
          $scan = Start-Process -FilePath $exe -ArgumentList @('update', 'scan', '--json') -Wait -PassThru -NoNewWindow -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'scan.json')
          Get-Content (Join-Path $env:RUNNER_TEMP 'scan.json')
          if ($scan.ExitCode -ne 0) { Write-Output "::warning title=scan::update scan exited with $($scan.ExitCode) on the build machine" }

      - name: Build the MSI
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add -g WixToolset.UI.wixext/6.0.2 WixToolset.Util.wixext/6.0.2
          $exe = (Resolve-Path "src/WinTool.App/bin/Release/net48/WinTool-by-PcNinja.exe").Path
          # The MSI version comes from the EXE itself (AppVersion.MsiVersion, D-024), so the two can never disagree.
          $versionOut = Join-Path $env:RUNNER_TEMP "version.json"
          Start-Process -FilePath $exe -ArgumentList @('version', '--json') -Wait -NoNewWindow -RedirectStandardOutput $versionOut
          $info = Get-Content $versionOut -Raw | ConvertFrom-Json
          Write-Host "Version $($info.version), file $($info.fileVersion), MSI $($info.msiVersion)"
          if ($env:WINTOOL_VERSION -and ($info.version -ne $env:WINTOOL_VERSION -or $info.fileVersion -ne $env:WINTOOL_FILE_VERSION)) {
            Write-Host "::error title=version::The EXE reports $($info.version) / $($info.fileVersion), the tag says $env:WINTOOL_VERSION / $env:WINTOOL_FILE_VERSION"
            exit 1
          }
          $version = $info.msiVersion
          $assets = (Resolve-Path "src/WinTool.App/Assets").Path
          $out = Join-Path $env:RUNNER_TEMP "msi"
          New-Item -ItemType Directory -Force $out | Out-Null
          Push-Location packaging/msi
          $log = & wix build -arch x64 -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -d "ExePath=$exe" -d "AssetsDir=$assets" -d "ProductVersion=$version" -o (Join-Path $out "WinTool-by-PcNinja.msi") Package.wxs 2>&1
          $code = $LASTEXITCODE
          Pop-Location
          $log | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $log | Where-Object { "$_" -match 'error' } | Select-Object -First 20 | ForEach-Object { Write-Host ("::error title=wix::" + ("$_" -replace '%', '%25')) }
            exit $code
          }
          Get-ChildItem $out | Format-Table Name, Length

      - name: MSI test (silent install, schedule, upgrade, uninstall, invalid value)
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP "msi\WinTool-by-PcNinja.msi"
          $installed = Join-Path ${env:ProgramFiles} "PcNinja\WinTool\WinTool-by-PcNinja.exe"
          function Msi([string[]]$arguments, [string]$name) {
            $log = Join-Path $env:RUNNER_TEMP "msi-$name.log"
            $p = Start-Process msiexec.exe -ArgumentList ($arguments + @('/qn', '/norestart', '/l*v', "`"$log`"")) -Wait -PassThru
            Write-Host "msiexec $name -> exit $($p.ExitCode)"
            return @{ Code = $p.ExitCode; Log = $log }
          }
          function Fail([string]$message, $result) {
            Write-Host "::error title=msi::$message"
            if ($result) { Get-Content $result.Log | Select-String -Pattern 'Return value 3|error|CustomAction' | Select-Object -Last 30 | ForEach-Object { Write-Host $_ } }
            exit 1
          }
          function Show() {
            $out = Join-Path $env:RUNNER_TEMP "show.json"
            Start-Process $installed -ArgumentList 'schedule','show','--json' -Wait -NoNewWindow -RedirectStandardOutput $out | Out-Null
            return Get-Content $out -Raw
          }

          # 1. An invalid value fails the install and leaves nothing behind.
          $r = Msi @('/i', "`"$msi`"", 'WINTOOL_ENABLE_SCHEDULE=1', 'WINTOOL_TIME=25:99') 'invalid'
          if ($r.Code -ne 1603) { Fail "invalid time should fail with 1603, got $($r.Code)" $r }
          if (Test-Path $installed) { Fail "files remained after a failed install" $null }

          # 2. Silent install with a weekly schedule and a desktop shortcut.
          $r = Msi @('/i', "`"$msi`"", 'WINTOOL_ENABLE_SCHEDULE=1', 'WINTOOL_FREQUENCY=Weekly', 'WINTOOL_DAY_OF_WEEK=Friday', 'WINTOOL_TIME=04:30', 'WINTOOL_WAKE_TO_RUN=1', 'WINTOOL_DESKTOP_SHORTCUT=1', 'WINTOOL_LANGUAGE=he') 'install'
          if ($r.Code -ne 0) { Fail "install failed with $($r.Code)" $r }
          if (-not (Test-Path $installed)) { Fail "WinTool-by-PcNinja.exe was not installed" $r }
          $show = Show
          Write-Host $show
          if ($show -notmatch '"matchesSettings": true' -or $show -notmatch '"dayOfWeek": "Friday"' -or $show -notmatch '"wakeToRun": true') { Fail "schedule from MSI properties is wrong" $r }
          if ((Get-ItemProperty 'HKLM:\SOFTWARE\PcNinja\WinTool').Language -ne 'he') { Fail "language default was not written" $r }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'WinTool by PcNinja.lnk'))) { Fail "desktop shortcut missing" $r }

          # 3. Installing again without schedule properties keeps the schedule (upgrade/repair path).
          $r = Msi @('/i', "`"$msi`"", 'REINSTALL=ALL', 'REINSTALLMODE=vomus') 'repair'
          if ($r.Code -ne 0) { Fail "repair failed with $($r.Code)" $r }
          if ((Show) -notmatch '"dayOfWeek": "Friday"') { Fail "repair changed the schedule" $r }

          # 4. Uninstall removes the files and the scheduled task.
          $r = Msi @('/x', "`"$msi`"") 'uninstall'
          if ($r.Code -ne 0) { Fail "uninstall failed with $($r.Code)" $r }
          if (Test-Path $installed) { Fail "files remained after uninstall" $r }
          schtasks.exe /Query /TN "\PcNinja\WinTool by PcNinja" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { Fail "scheduled task remained after uninstall" $r }
          Write-Host "MSI test passed."
          exit 0

      - name: Upload MSI
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: WinTool-by-PcNinja-msi-unsigned
          path: ${{ runner.temp }}/msi/WinTool-by-PcNinja.msi
          if-no-files-found: error

      - name: Upload UI screenshots
        if: matrix.configuration == 'Release' && always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/ui-screenshots
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.configuration }}
          path: TestResults

      - name: Upload portable EXE
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: WinTool-by-PcNinja-portable-unsigned
          path: src/WinTool.App/bin/Release/net48/WinTool-by-PcNinja.exe
          if-no-files-found: error

      # D-026: the universal EXE carries the MSI built above (app EXE -> MSI -> universal EXE).
      # Releases ship it as WinTool-by-PcNinja.exe; the MSI it carries is the one beside it.
      - name: Universal EXE (D-026)
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP "msi/WinTool-by-PcNinja.msi"
          $out = Join-Path $env:RUNNER_TEMP "universal/"
          $build = @("build", "src/WinTool.App/WinTool.App.csproj", "-c", "Release", "--no-restore", "-v", "minimal",
                     "-p:EmbeddedMsi=$msi", "-p:OutDir=$out")
          if ($env:WINTOOL_VERSION_ARGS) { $build += $env:WINTOOL_VERSION_ARGS.Split(' ') }
          & dotnet @build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $out "WinTool-by-PcNinja.exe"
          # Alone in an empty folder, the command line works and never asks Install / Run portable.
          $alone = Join-Path $env:RUNNER_TEMP "universal-alone"
          New-Item -ItemType Directory -Force $alone | Out-Null
          Copy-Item $exe $alone
          $p = Start-Process -FilePath (Join-Path $alone "WinTool-by-PcNinja.exe") -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { Write-Host "::error title=universal::self-test exit $($p.ExitCode)"; exit 1 }
          $plain = (Get-Item "src/WinTool.App/bin/Release/net48/WinTool-by-PcNinja.exe").Length
          $size = (Get-Item $exe).Length
          Write-Host ("Universal EXE {0:N0} bytes (app-only EXE {1:N0}, MSI {2:N0})" -f $size, $plain, (Get-Item $msi).Length)
          if ($size -le (Get-Item $msi).Length) { Write-Host "::error title=universal::the EXE does not contain the MSI"; exit 1 }

      - name: Upload universal EXE
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: WinTool-by-PcNinja-universal-unsigned
          path: ${{ runner.temp }}/universal/WinTool-by-PcNinja.exe
          if-no-files-found: error
