name: Integrated RC candidate

# Test artifacts only. Calling CI does not invoke the Release workflow,
# create a Git tag or create/publish a GitHub release.
on:
  pull_request:

permissions:
  contents: read

jobs:
  candidate:
    if: github.head_ref == 'codex/integrated-maintenance-candidate' || github.head_ref == 'codex/cancel-boundary-and-state' || github.head_ref == 'codex/selected-search-optimization' || github.head_ref == 'codex/last-run-display'
    uses: ./.github/workflows/ci.yml
    with:
      tag: v1.0.3-rc.7
